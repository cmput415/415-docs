# Render context for .agents/*.tmpl and desired state for healthcheck.sh.
# This file is committed; identity is intentionally left blank. Each user
# fills in an `agent:` block locally (or leaves it empty to skip signing).

project: 415-docs

# System packages the bootstrap installs via apt. Python packages are managed
# separately by uv (see `pyproject.toml`), not apt.
apt_packages:
  - name: gnupg
    version: null
  - name: graphviz
    version: null
  - name: curl
    version: null

# Runnable-on-PATH checks. `uv` is bootstrapped by the install script itself
# when missing (curl-piped from astral.sh), so it belongs in commands rather
# than apt_packages.
commands:
  - cmd: gpg
    package: gnupg
    version_flag: --version
  - cmd: dot
    package: graphviz
    version_flag: -V
  - cmd: uv
    package: uv
    version_flag: --version

# Signing identity for `git agent-commit`. Leave every field null/empty to
# opt out of GPG entirely -- bootstrap will skip key generation, and check /
# healthcheck will not require an agent key. To opt in, fill in name/email
# (and optionally key_expiry, default `1w`); the identity you put here is
# yours to choose. Not prescribed by this repo.
agent:
  name: null
  email: null
  key_expiry: 1w

# Skills bundled with this repo for review/consistency work over the spec.
# Each entry names a directory under `.agents/skills/` that contains a
# SKILL.md file. The healthcheck asserts these directories still exist.
skills: []

sentinels:
  - .agents/bootstrap.sh.tmpl
  - .agents/check.sh.tmpl
  - .agents/healthcheck.sh.tmpl
  - .agents/render.py
  - .agents/manifest.yaml
  - pyproject.toml

# Project-specific readiness probes evaluated by healthcheck.
extra_checks:
  - name: inside the 415-docs repo
    cmd: git rev-parse --is-inside-work-tree
  - name: sphinx importable from the uv-managed venv
    cmd: uv run python -c "import sphinx, sys; sys.exit(0 if sphinx.__version__.startswith(\"6.2\") else 1)"
