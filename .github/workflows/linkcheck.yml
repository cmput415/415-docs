name: Link Checker

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Sphinx
        run: pip install -r requirements.txt

      # Per-project linkcheck settings live in each conf.py; the
      # builder itself exits non-zero on any broken link.
      - name: Run sphinx-build -b linkcheck for every project
        run: |
          status=0
          for dir in setup generator scalc vcalc gazprea info; do
            echo "::group::linkcheck $dir"
            if ! sphinx-build -b linkcheck "$dir" "$dir/_build/linkcheck"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
